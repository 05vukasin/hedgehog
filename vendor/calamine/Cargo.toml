# calamine 0.37.0 (MIT, https://github.com/tafia/calamine), vendored with robustness fixes for
# hostile files found by hedgehog's fuzzer (fuzz/). Used through [patch.crates-io] in the
# workspace Cargo.toml. Every change is marked `hedgehog:` in the source; drop this copy once the
# fixes are upstream. Tests, benches and examples are not copied.
[package]
name = "calamine"
version = "0.37.0"
authors = ["Johann Tuffe <tafia973@gmail.com>"]
repository = "https://github.com/tafia/calamine"
description = "An Excel/OpenDocument Spreadsheet reader and deserializer in pure Rust"
license = "MIT"
readme = "README.md"
edition = "2021"
rust-version = "1.88"
autoexamples = false
autobenches = false
autotests = false

[dependencies]
log = "0.4"
serde = "1.0"
codepage = "0.1"
atoi_simd = "0.18"
byteorder = "1.5"
encoding_rs = "0.8"
fast-float2 = "0.2"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42", features = ["encoding"] }
chrono = { version = "0.4", features = ["serde"], optional = true, default-features = false }

[features]
default = []
chrono = ["dep:chrono"]
picture = []
dates = ["chrono"]
