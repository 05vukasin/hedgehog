[workspace]
resolver = "3"
members = ["core", "py", "cli", "agent", "node", "fuzz"]
# calamine with fixes for hostile files (vendor/calamine/Cargo.toml); patched in, not a member.
exclude = ["vendor"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/05vukasin/hedgehog"

[workspace.dependencies]
hh_core = { path = "core" }
hh_agent = { path = "agent" }
calamine = "0.37.0"
pyo3 = "0.30.1"
rust_xlsxwriter = { version = "0.99.1", features = ["constant_memory", "zmij"] }
# same major as calamine uses, so it is not compiled twice
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rustc-hash = "2.1.3"

# calamine 0.37.0 plus the fixes for hostile files the fuzzer found (each marked `hedgehog:`).
[patch.crates-io]
calamine = { path = "vendor/calamine" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

# The Node addon (node/, `npm run build`): a Rust panic must become a JS exception, not abort the
# host process (an editor, a TUI), so it unwinds. Stripped: the unstripped addon is ~90 MB.
[profile.node-release]
inherits = "release"
panic = "unwind"
strip = true

# Release build with symbols and thin LTO: for profilers and fast iteration on perf work.
[profile.profiling]
inherits = "release"
debug = true
lto = "thin"
codegen-units = 16

# The mutation fuzzer (fuzz/, `hh_fuzz`): optimized, but with debug assertions and overflow checks
# (they turn silent wraparounds into findings) and unwinding, so a panic is caught and recorded.
[profile.fuzz]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"
