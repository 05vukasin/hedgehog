[workspace]
resolver = "3"
members = ["core", "py", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hh_core = { path = "core" }
calamine = "0.37.0"
pyo3 = "0.30.1"
rust_xlsxwriter = "0.99.1"
# same major as calamine uses, so it is not compiled twice
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rustc-hash = "2.1.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

# Release build with symbols and thin LTO: for profilers and fast iteration on perf work.
[profile.profiling]
inherits = "release"
debug = true
lto = "thin"
codegen-units = 16
