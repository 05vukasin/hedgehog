[project]
name = "hh_noise"
version = "0.1.0"
description = "Noise generator: clean tables -> messy spreadsheets with exact ground truth (hedgehog M5)"
requires-python = ">=3.10"
dependencies = ["xlsxwriter>=3.2", "python-calamine>=0.3", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
