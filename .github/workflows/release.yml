# Builds prebuilt wheels (no Rust needed by users), standalone `hedgehog` CLI binaries and the
# Node package's native addons for Linux, macOS and Windows.
# - Manual run (Actions tab → release → Run workflow): build and test only.
# - Push a tag `vX.Y.Z` (matching the workspace version in Cargo.toml and node/package.json): also
#   attach them (and the npm tarballs) to a GitHub Release, publish to PyPI when the repository
#   variable PUBLISH_PYPI is "true", and to npm when PUBLISH_NPM is "true".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, smoke: true }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, smoke: false }
          - { name: macos-universal2, runner: macos-latest, target: universal2-apple-darwin, smoke: true }
          - { name: windows-x64, runner: windows-latest, target: x64, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist -m py/Cargo.toml
      - name: Smoke test (install without Rust, import, open a generated workbook)
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist hedgehog-sheets
          python -m pip install openpyxl
          python - <<'PY'
          import openpyxl, hedgehog
          wb = openpyxl.Workbook(); ws = wb.active
          ws.append(["City", "Budget"]); ws.append(["Beograd", 1200.5]); ws.append(["Total", 1200.5])
          wb.save("smoke.xlsx")
          print(hedgehog.open("smoke.xlsx").describe())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist
          retention-days: 1

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          retention-days: 1

  # Standalone `hedgehog` CLI binaries (no Python needed), e.g. for `hedgehog mcp`.
  # Attached to the release as hedgehog-<target>[.exe] with SHA256SUMS.txt.
  cli:
    name: cli ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: binaries built against an older glibc run on more distributions
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, smoke: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, smoke: true }
          - { target: aarch64-apple-darwin, runner: macos-latest, smoke: true }
          # cross-compiled on the Apple Silicon runner (Xcode's clang targets both)
          - { target: x86_64-apple-darwin, runner: macos-latest, smoke: false }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, smoke: true }
    steps:
      - uses: actions/checkout@v4
      # toolchain version comes from rust-toolchain.toml
      - run: rustup target add ${{ matrix.target }}
        shell: bash
      - name: Build
        shell: bash
        run: cargo build --release --locked -p hh_cli --target ${{ matrix.target }}
      - name: Name the binary hedgehog-<target>
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/hedgehog$ext" "dist/hedgehog-${{ matrix.target }}$ext"
      - name: Smoke test (MCP initialize + tools/list over stdio)
        if: matrix.smoke
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          out=$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | "dist/hedgehog-${{ matrix.target }}$ext" mcp)
          echo "$out"
          grep -q '"protocolVersion":"2025-06-18"' <<<"$out"
          grep -q '"name":"open_file"' <<<"$out"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist
          retention-days: 1

  # Node package `hedgehog-sheets` (napi-rs): one native addon per platform, published as
  # hedgehog-sheets-<platform> packages that the main package lists as optionalDependencies.
  node:
    name: node ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, smoke: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, smoke: true }
          - { target: aarch64-apple-darwin, runner: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, runner: macos-latest, smoke: false }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, smoke: true }
    defaults:
      run:
        shell: bash
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Build the addon
        run: npm run build -- --target ${{ matrix.target }}
      - name: The committed JS loader and types are current
        if: runner.os == 'Linux'
        run: git diff --exit-code -- binding.js binding.d.ts
      - name: Test (node --test) and type-check
        if: matrix.smoke
        run: npm test && npm run typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: node/hedgehog.*.node
          if-no-files-found: error
          retention-days: 1

  # npm tarballs of every platform package and the main package. Published to npm only when the
  # repository variable PUBLISH_NPM is "true" (secret NPM_TOKEN: an npm automation token); the
  # tarballs are attached to the GitHub Release either way.
  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # npm provenance
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Version matches the tag
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "${{ github.ref_name }}" || { echo "node/package.json version $v does not match tag ${{ github.ref_name }}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          merge-multiple: true
          path: node/artifacts
      - name: Platform packages and optionalDependencies
        run: |
          cp ../LICENSE .
          npx napi create-npm-dirs
          npx napi artifacts
          npx napi prepublish -t npm --skip-optional-publish --no-gh-release
      - name: Pack
        run: |
          mkdir -p ../dist-npm
          for d in npm/*/; do (cd "$d" && cp ../../LICENSE . && npm pack --pack-destination ../../../dist-npm); done
          npm pack --pack-destination ../dist-npm
          ls -l ../dist-npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: dist-npm
          retention-days: 1
      - name: Publish to npm
        if: vars.PUBLISH_NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in npm/*/; do (cd "$d" && npm publish --access public --provenance); done
          npm publish --access public --provenance --ignore-scripts

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, cli, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: dist
      - name: Checksums
        run: |
          cd dist
          chmod +x hedgehog-* || true
          sha256sum hedgehog-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release with wheels and CLI binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --prerelease

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
