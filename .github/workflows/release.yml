# Builds prebuilt wheels (no Rust needed by users) for Linux, macOS and Windows.
# - Manual run (Actions tab → release → Run workflow): build and test wheels only.
# - Push a tag `vX.Y.Z` (matching the workspace version in Cargo.toml): also attach them to a
#   GitHub Release, and publish to PyPI when the repository variable PUBLISH_PYPI is "true".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, smoke: true }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, smoke: false }
          - { name: macos-universal2, runner: macos-latest, target: universal2-apple-darwin, smoke: true }
          - { name: windows-x64, runner: windows-latest, target: x64, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist -m py/Cargo.toml
      - name: Smoke test (install without Rust, import, open a generated workbook)
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist hedgehog-sheets
          python -m pip install openpyxl
          python - <<'PY'
          import openpyxl, hedgehog
          wb = openpyxl.Workbook(); ws = wb.active
          ws.append(["City", "Budget"]); ws.append(["Beograd", 1200.5]); ws.append(["Total", 1200.5])
          wb.save("smoke.xlsx")
          print(hedgehog.open("smoke.xlsx").describe())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist
          retention-days: 1

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          retention-days: 1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release with wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --prerelease

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
